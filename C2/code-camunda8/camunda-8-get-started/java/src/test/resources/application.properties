spring.application.name=Process Order
camunda.client.mode=self-managed
camunda.client.grpc-address=${CAMUNDA_GRPC_ADDRESS:http://127.0.0.1:26500}
camunda.client.rest-address=${CAMUNDA_REST_ADDRESS:http://127.0.0.1:8080}

logging.level.io.camunda.client.impl.CamundaCallCredentials=ERROR

# Optional demo runner for the Owner contract flow
owner.contract.demo.enabled=false

